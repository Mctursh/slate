# Vendored from solana-stake-program 3.0.14 (crates.io). See PROVENANCE.md for
# the source commit, why it's here, and the exact changes from upstream.
# Trimmed to the library only: tests, benches, and dev-dependencies removed;
# the 5 runtime pins repointed =3.0.14 -> =3.1.14 to build against slate's runtime.

[package]
edition = "2021"
name = "solana-stake-program"
version = "3.0.14"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Solana Stake program"
homepage = "https://anza.xyz/"
documentation = "https://docs.rs/solana-stake-program"
readme = false
license = "Apache-2.0"
repository = "https://github.com/anza-xyz/agave"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "solana_stake_program"
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies.agave-feature-set]
version = "=3.1.14"

[dependencies.bincode]
version = "1.3.3"

[dependencies.log]
version = "0.4.27"

[dependencies.solana-account]
version = "3.0.0"

[dependencies.solana-bincode]
version = "3.0.0"

[dependencies.solana-clock]
version = "3.0.0"

[dependencies.solana-config-interface]
version = "2.0.0"
features = ["bincode"]

[dependencies.solana-genesis-config]
version = "3.0.0"

[dependencies.solana-instruction]
version = "3.0.0"

[dependencies.solana-native-token]
version = "3.0.0"

[dependencies.solana-packet]
version = "3.0.0"

[dependencies.solana-program-runtime]
version = "=3.1.14"

[dependencies.solana-pubkey]
version = "3.0.0"
features = ["sha2"]
default-features = false

[dependencies.solana-rent]
version = "3.0.0"

[dependencies.solana-sdk-ids]
version = "3.0.0"

[dependencies.solana-stake-interface]
version = "2.0.1"

[dependencies.solana-svm-log-collector]
version = "=3.1.14"

[dependencies.solana-svm-type-overrides]
version = "=3.1.14"

[dependencies.solana-sysvar]
version = "3.0.0"

[dependencies.solana-transaction-context]
version = "=3.1.14"
features = [
    "bincode",
    "bincode",
]

[dependencies.solana-vote-interface]
version = "3.0.0"
features = ["bincode"]

[lints.clippy]
arithmetic_side_effects = "deny"
default_trait_access = "deny"
manual_let_else = "deny"
used_underscore_binding = "deny"

[lints.rust]
warnings = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
