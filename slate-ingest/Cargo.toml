[package]
name = "slate-ingest"
version = "0.2.0"
edition = "2024"


[dependencies]
# pinned to the solana-accounts-db version that reads this snapshot format; don't bump casually
solana-accounts-db = { version = "3.1.5", features = ["agave-unstable-api"] }
solana-account = "3.0.0"
solana-pubkey = "4.0.0"

tar = "0.4"
zstd = "0.13"
bincode = "1.3"

anyhow = "1"

slate-store = { path = "../slate-store"}
slate-common = { path = "../slate-common" }
clap = { workspace = true }
tokio = { workspace = true }

yellowstone-grpc-client = "13.2.1"
yellowstone-grpc-proto = "12.5.0"
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
bs58 = "0.5"                       # base58-encode the transaction signature
serde_json = { workspace = true }
