# Slate config. Copy to slate.toml and fill in. slate.toml is gitignored, so the token you put
# there never lands in git; this committed example carries only a placeholder.

[clickhouse]
url = "http://localhost:8123"
database = "slate"
user = "slate"
password = "slate"

[ingest]
# Yellowstone gRPC endpoint for the live stream.
grpc-endpoint = "https://your-grpc-endpoint:443"
# The program whose accounts Slate captures (owner scope).
program = "SPoo1Ku8WFXoNDMHPsrGSTSG1Y47rzgn41SLUNakuHy"
# gRPC auth token. GRPC_TOKEN env overrides this.
x-token = "<YOUR_GRPC_TOKEN>"
# JSON-RPC endpoint for the getProgramAccounts baseline (any full RPC; put its api key in the URL).
baseline-rpc = "https://your-rpc-endpoint"

[rpc]
# Address the JSON-RPC server binds to.
bind = "127.0.0.1:8899"
