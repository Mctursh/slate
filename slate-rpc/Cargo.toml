[package]
name = "slate-rpc"
version = "0.2.0"
edition = "2024"

[dependencies]
jsonrpsee = { version = "0.26.0", features = ["server", "macros"] }

slate-store = { path = "../slate-store" }
slate-common = { path = "../slate-common" }
clap = { workspace = true }

# Agave-compatible response shaping
solana-account = "3.0.0"
solana-account-decoder = { version = "3.1.5", features = ["agave-unstable-api"] }
solana-account-decoder-client-types = "3.1.5"
solana-rpc-client-api = "3.1.5"
solana-pubkey = "4.0.0"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = "1"
