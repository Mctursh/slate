# Era 1: mainnet epochs 807..978 on agave 3.1.14. Its own workspace, lockfile and
# toolchain so that adding a later era cannot re-resolve this one's dependency graph,
# which would invalidate its proof. See ../README.md.
[workspace]
resolver = "3"
members = ["slate-replay", "slate-backfill"]

# Duplicated from the root deliberately: an era pins its own, so bumping the live
# pipeline's tokio can't touch a frozen era.
[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.53.0", features = ["full"] }
