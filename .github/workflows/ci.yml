name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Start ClickHouse
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8123/?user=slate&password=slate" --data "SELECT 1" >/dev/null; then
              echo "ClickHouse ready"; exit 0
            fi
            sleep 2
          done
          echo "ClickHouse did not become ready" >&2; exit 1

      - name: Create test database
        run: |
          docker exec -i slate-clickhouse clickhouse-client --user slate --password slate \
            --query "CREATE DATABASE IF NOT EXISTS slate_test"
          for f in slate-common/ddl/*.sql; do
            sed 's/slate\./slate_test./g' "$f" \
              | docker exec -i slate-clickhouse clickhouse-client --user slate --password slate --multiquery
          done

      - name: Test
        run: cargo test --workspace -- --test-threads=1
